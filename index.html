<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STATS CAPTAIN - موسوعة إحصائيات اللاعبين</title>
    
    <!-- CSS Tweak & Styling -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #e11d48;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box, .filter-select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box {
            width: 280px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(225, 29, 72, 0.3);
        }

        .card-img-container {
            width: 100%;
            height: 200px;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-img-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .badge-rarity {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            color: #fff;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .skill-title {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 8px;
            font-weight: bold;
        }

        .error-message {
            text-align: center;
            color: var(--accent-color);
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>STATS CAPTAIN</h1>
        <p>الموسوعة الشاملة لمقارنة وإحصائيات اللاعبين</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم اللاعب أو النادي...">
        <select id="attributeFilter" class="filter-select">
            <option value="ALL">جميع الخصائص</option>
            <option value="STR">STR (قوة)</option>
            <option value="AGL">AGL (سرعة)</option>
            <option value="PHY">PHY (بدني)</option>
        </select>
    </div>

    <!-- شبكة عرض البطاقات -->
    <div class="grid-container" id="playersGrid">
        <!-- سيتم تحميل البيانات هنا ديناميكياً -->
    </div>

    <!-- JavaScript لجلب البيانات والتحكم في الصفحة -->
    <script>
        let allPlayers = [];

        // دالة جلب البيانات من ملف players.json باستخدام المسار النسبي المضمون
        async function fetchPlayers() {
            const grid = document.getElementById('playersGrid');
            try {
                // استخدمنا المسار النسبي الصحيح لـ GitHub Pages
                const response = await fetch('./players.json');
                
                if (!response.ok) {
                    throw new Error(`تعذر التحميل! حالة الاستجابة: ${response.status}`);
                }
                
                allPlayers = await response.json();
                renderPlayers(allPlayers);

            } catch (error) {
                console.error("خطأ أثناء قراءة الملف:", error);
                grid.innerHTML = `
                    <div class="error-message">
                        ⚠️ تعذر تحميل البيانات من ملف <b>players.json</b>.<br>
                        تأكد أن الملف موجود في نفس مجلد ملف HTML ومرفوع على GitHub بنجاح.
                    </div>`;
            }
        }

        // دالة عرض اللاعبين في الصفحة
        function renderPlayers(players) {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';

            if (players.length === 0) {
                grid.innerHTML = '<div class="error-message">لم يتم العثور على أي لاعبين مطبق عليهم البحث.</div>';
                return;
            }

            players.forEach(player => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <div class="card-img-container">
                        <span class="badge-rarity">${player.rarity}</span>
                        <img src="${player.image_url}" alt="${player.name}" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${player.name}</h3>
                        <div class="card-subtitle">${player.title} | ${player.team}</div>
                        
                        <div class="stats-grid">
                            <div>المركز: <b>${player.position}</b></div>
                            <div>الخاصية: <b>${player.attribute}</b></div>
                            <div>التحمل: <b>${player.stamina || 'N/A'}</b></div>
                            <div>الجنسية: <b>${player.nationality}</b></div>
                        </div>

                        <div class="skill-title">المهارة الأساسية:</div>
                        <div style="font-size:0.85rem; color:#e2e8f0;">${player.main_skill}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // أداء الفلترة والبحث
        function filterPlayers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedAttr = document.getElementById('attributeFilter').value;

            const filtered = allPlayers.filter(player => {
                const matchesSearch = player.name.toLowerCase().includes(searchTerm) || 
                                      player.team.toLowerCase().includes(searchTerm);
                const matchesAttr = selectedAttr === 'ALL' || player.attribute === selectedAttr;
                
                return matchesSearch && matchesAttr;
            });

            renderPlayers(filtered);
        }

        // إعداد مستمعي الأحداث للبحث
        document.getElementById('searchInput').addEventListener('input', filterPlayers);
        document.getElementById('attributeFilter').addEventListener('change', filterPlayers);

        // تشغيل التحميل بمجرد اكتمال بناء الصفحة
        document.addEventListener('DOMContentLoaded', fetchPlayers);
    </script>
</body>
</html>
